name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation-testing:
    name: Mutation test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
      - name: Install imp
        env:
          IMP_VERSION: 0.7.1
          IMP_SHA256: a44452b55e6a28056415abc52867029ec27a6f9c9183e3ccca5679ae85901e27
        run: |
          archive="imp_${IMP_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/smedijan/go-imp/releases/download/v${IMP_VERSION}/${archive}"
          curl --fail --location --silent --show-error "$url" --output "$RUNNER_TEMP/$archive"
          echo "$IMP_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/imp"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/imp" imp
          echo "$RUNNER_TEMP/imp" >> "$GITHUB_PATH"
      - name: Run imp
        run: imp run --silent

  lint:
    name: Lint and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
      - name: Check formatting
        run: test -z "$(git ls-files '*.go' | xargs gofmt -s -l)"
      - name: Run go vet
        run: go vet ./...
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  test:
    name: Tests with coverage
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
      - name: Run tests with coverage
        run: go test -race -covermode=atomic -cover -coverprofile coverage.out ./...
